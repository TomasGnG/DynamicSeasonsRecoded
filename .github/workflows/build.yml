name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with ShadowJar
        run: ./gradlew shadowJar

      - name: Rename JAR
        run: mv build/libs/*-all.jar build/libs/DynamicSeasons.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DynamicSeasons
          path: build/libs/DynamicSeasons.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DynamicSeasons

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DynamicSeasons.jar
          generate_release_notes: true
